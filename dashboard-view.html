<script>
const starterSettings = {schoolName:'Northstar Academy',adminName:'School administrator',year:'2026–2027',term:'Autumn term',currency:'USD',contactEmail:''};
const readStore = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
// Student records and dashboard totals come from dashboard-data.php, not browser demo data.
let students = [];
let dashboardStats = {students:null,teachers:null,classes:null,enrollments:null};
let dashboardLoaded = false;
let dashboardError = '';
let attendanceToday = null;
let todayClasses = [];
let csrfToken = '';
const moduleData = {};
const moduleEditing = {};
let settings = readStore('northstar-settings', starterSettings);
let activePage = 'Overview';
let currentSearch = '';
const page = document.getElementById('page');
const avatar = s => `<span class="avatar ${s.tone || 'green'}">${escapeHtml(s.initials || initials(s.full_name||s.name||''))}</span>`;
function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function initials(name){return name.split(/\s+/).map(part=>part[0]).slice(0,2).join('').toUpperCase();}
function todayKey(){const now=new Date();return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;}
function todayLabel(){return new Intl.DateTimeFormat('en',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());}
function dateLabel(date){return new Intl.DateTimeFormat('en',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(date+'T00:00:00'));}
function studentPhoto(student){if(student.photo_path){return `<span class="student-photo"><img src="${escapeHtml(student.photo_path)}" alt="Photo of ${escapeHtml(student.full_name)}"></span>`;}return `<span class="photo-fallback" aria-label="No photo uploaded">${escapeHtml(initials(student.full_name))}</span>`;}
function databaseStudentRows(list=students){return list.map(student=>{const status=student.enrollment_status||'Not tracked';const studentNumber=student.student_number||`#${student.id}`;return `<tr><td>${studentPhoto(student)}</td><td>${escapeHtml(studentNumber)}</td><td><div class="student-name">${escapeHtml(student.full_name)}</div></td><td>${escapeHtml(student.class_name||'Not assigned')}</td><td>${student.email?escapeHtml(student.email):'<span class="muted">Not provided</span>'}</td><td><span class="pill">${escapeHtml(status)}</span></td><td><a class="student-detail-link" href="student-details.php?id=${encodeURIComponent(student.id)}">View details</a></td></tr>`;}).join('');}
function heading(kicker,title,description,actions=''){return `<div class="welcome"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${description}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;}
function overview(){
  const attended=attendanceToday?.total||0;
  const present=attendanceToday?.Present||0;
  const presentRate=attended?Math.round(present/attended*100):0;
  const attendancePanel=attendanceToday===null
    ? '<div class="empty"><h2>Attendance data unavailable</h2><p>The attendance table is not set up yet.</p></div>'
    : attended===0
      ? '<div class="empty"><h2>No attendance recorded today</h2><p>Use Attendance to save today’s register to MySQL.</p></div>'
      : `<div class="attendance-summary"><div class="ring"><b>${presentRate}%</b></div><div><h3>${present} present</h3><p>${attended} attendance records saved today</p></div></div><div class="minirow"><span>Present</span><strong>${present}</strong></div><div class="minirow"><span>Absent</span><strong>${attendanceToday.Absent||0}</strong></div><div class="minirow"><span>Late / excused</span><strong>${(attendanceToday.Late||0)+(attendanceToday.Excused||0)}</strong></div>`;
  const lessons=todayClasses.length?`<div class="schedule">${todayClasses.map(item=>`<div class="event"><span class="time">${escapeHtml(String(item.start_time).slice(0,5))}</span><i class="eventbar"></i><div><b>${escapeHtml(item.subject)}</b><small>${escapeHtml(item.class_name)}${item.room?' · Room '+escapeHtml(item.room):''} · ends ${escapeHtml(String(item.end_time).slice(0,5))}</small></div></div>`).join('')}</div>`:'<div class="empty"><h2>No lessons scheduled today</h2><p>Add today’s lessons to the timetable to see them here.</p></div>';
  return `${heading(settings.term.toUpperCase()+' · '+todayLabel().toUpperCase(),`Good morning, ${escapeHtml(settings.adminName)} <span>✦</span>`,`Here’s what’s happening at ${escapeHtml(settings.schoolName)} today.`,`<a class="btn" href="students.php">♙ &nbsp;Student register</a><a class="btn primary" href="parent-portal.php">Parent website ↗</a>`)}
  <section class="stats">
    <article class="card stat"><div class="stat-top">Total students<span class="stat-ico">♙</span></div><div class="stat-num">${dashboardStats.students??'—'}</div><div class="trend">${dashboardLoaded?'From MySQL':'Loading database…'}</div></article>
    <article class="card stat"><div class="stat-top">Total teachers<span class="stat-ico">♧</span></div><div class="stat-num">${dashboardStats.teachers??'—'}</div><div class="trend">${dashboardStats.teachers===null?'Teachers table not set up':'From MySQL'}</div></article>
    <article class="card stat"><div class="stat-top">Total classes<span class="stat-ico">▦</span></div><div class="stat-num">${dashboardStats.classes??'—'}</div><div class="trend">${dashboardStats.classes===null?'Classes table not set up':'From MySQL'}</div></article>
    <article class="card stat"><div class="stat-top">Total enrollments<span class="stat-ico">✓</span></div><div class="stat-num">${dashboardStats.enrollments??'—'}</div><div class="trend">${dashboardStats.enrollments===null?'Enrollments table not set up':'From MySQL'}</div></article>
  </section>
  ${dashboardError?`<p class="notice">${escapeHtml(dashboardError)}</p>`:''}<section class="hero-photo card"><img src="images/schoolchildren-classroom.jpg" alt="Students reading together in a classroom"><div><span class="eyebrow">A place to learn and grow</span><h2>Every student belongs here.</h2><p>Keep student records together and build out the school modules as the database grows.</p><small>Classroom photo · US Department of Education · CC BY 2.0</small></div></section>
  <section class="grid"><article class="card panel"><div class="panelhead"><div><h2>Attendance today</h2><p>Counts from records saved in MySQL</p></div><button class="link" data-go="Attendance">Open register →</button></div>${attendancePanel}</article><article class="card panel"><div class="panelhead"><div><h2>Today’s timetable</h2><p>Lessons scheduled for today</p></div><button class="link" data-go="Timetable">Manage timetable →</button></div>${lessons}</article></section>
  <section class="card panel"><div class="panelhead"><div><h2>Recently registered students</h2><p>Latest records read from the school database</p></div><button class="link" data-go="Students">View student list →</button></div><div class="tablewrap"><table><thead><tr><th>Photo</th><th>Student ID</th><th>Full name</th><th>Class</th><th>Email</th><th>Enrollment status</th><th>Action</th></tr></thead><tbody>${databaseStudentRows(students.slice(0,5))||`<tr><td colspan="7">${dashboardLoaded?'No students registered yet.':'Connect to the database to load students.'}</td></tr>`}</tbody></table></div></section>`;
}function studentsPage(){return `${heading('NORTHSTAR ACADEMY / LEARNERS','Students','Browse registered student records. Search by full name or student ID.','<a class="btn primary" href="students.php">＋ &nbsp;Register a student</a>')}<section class="card panel"><div class="panelhead"><div><h2>Student directory</h2><p>${students.length} database record${students.length===1?'':'s'} currently shown</p></div></div>${currentSearch?`<div class="search-results">Search results for “${escapeHtml(currentSearch)}”</div>`:''}<div class="tablewrap"><table><thead><tr><th>Photo</th><th>Student ID</th><th>Full name</th><th>Class</th><th>Email</th><th>Enrollment status</th><th>Action</th></tr></thead><tbody>${databaseStudentRows()||'<tr><td colspan="7">No matching students found.</td></tr>'}</tbody></table></div><p class="notice" style="margin-top:14px">This database has no per-student photo or enrollment-status fields yet. Initials and “Not tracked” are shown until those fields are added. The school banner image is a reusable classroom photo, not a registered student’s portrait.</p></section>`;}
function teachersPage(){return managedPage('teachers');}
function attendancePage(){return managedPage('attendance');}
const moduleTitles={teachers:'Teachers',classes:'Classes',enrollments:'Enrollments',attendance:'Attendance',payments:'Finance',timetable:'Timetable',announcements:'School news',learning_updates:'Learning updates',achievements:'Achievements'};
function managedPage(module){
  const data=moduleData[module];
  const title=moduleTitles[module];
  if(!data)return `${heading('NORTHSTAR ACADEMY / SCHOOL RECORDS',title,'Loading records from the school database…')}<section class="card panel"><div class="empty">Loading…</div></section>`;
  const editing=moduleEditing[module]||null;
  const fieldHtml=Object.entries(data.fields).map(([name,definition])=>{
    const [label,type,required,source]=definition;const today=todayKey();const initial={academic_year:settings.year,enrolled_on:today,attendance_date:today,paid_on:today,currency:settings.currency||'USD'};const value=editing?.[name]??initial[name]??'';let control='';
    if(type==='select'){
      const choices=Array.isArray(source)?source:(data.options[source]||[]).map(item=>({value:item.value,label:item.label}));
      control=`<select name="${name}" ${required?'required':''}>${required?'':'<option value="">Choose (optional)</option>'}${choices.map(option=>{const choice=typeof option==='string'?{value:option,label:option}:option;return `<option value="${escapeHtml(choice.value)}" ${String(choice.value)===String(value)?'selected':''}>${escapeHtml(choice.label)}</option>`;}).join('')}</select>`;
    }else if(type==='textarea')control=`<textarea name="${name}" rows="3" ${required?'required':''}>${escapeHtml(value)}</textarea>`;
    else if(module==='teachers'&&name==='photo_path')control=`<div class="teacher-photo-picker"><div class="teacher-photo-preview" data-teacher-photo-preview>${value?`<img src="${escapeHtml(value)}" alt="Current teacher photo">`:'<span>＋</span>'}</div><div><label class="btn small" for="teacherPhotoFile">${value?'Replace photo':'Choose photo from gallery'}</label><input class="teacher-photo-input" id="teacherPhotoFile" name="teacher_photo" type="file" accept="image/jpeg,image/png,image/webp"><small class="teacher-photo-help">Choose a photo from this device. JPEG, PNG, or WebP, up to 2 MB.</small><small class="teacher-photo-filename" data-teacher-photo-filename>${value?'Current photo saved':'No photo selected'}</small>${value?'<button class="btn small danger" type="button" data-remove-teacher-photo>Remove photo</button>':''}</div></div>`;
    else control=`<input name="${name}" type="${type}" value="${escapeHtml(value)}" ${required?'required':''} ${name==='amount'?'min="0.01" step="0.01"':''}>`;
    return `<div class="field"><label>${escapeHtml(label)}${required?' *':''}</label>${control}</div>`;
  }).join('');
  const labels={teacher_id:'teacher_name',student_id:'student_name',class_id:'class_name'};
  const headers=Object.entries(data.fields).map(([,d])=>`<th>${escapeHtml(d[0])}</th>`).join('');
  const rows=data.records.map(record=>`<tr>${Object.keys(data.fields).map(key=>{const display=labels[key]||key;const value=String(record[display]??record[key]??'');if(module==='teachers'&&key==='photo_path')return `<td>${value?`<img class="teacher-row-photo" src="${escapeHtml(value)}" alt="Photo of ${escapeHtml(`${record.first_name} ${record.last_name}`)}">`:'<span class="muted">No photo</span>'}</td>`;return `<td>${escapeHtml(value.length>120?value.slice(0,120)+'…':value)}</td>`;}).join('')}<td class="row-actions"><button class="btn small" data-record-edit="${module}" data-id="${record.id}">Edit</button><button class="btn small danger" data-record-delete="${module}" data-id="${record.id}">Delete</button></td></tr>`).join('');
  const descriptions={teachers:'Add teacher names, contact details, subjects, status, and a local photo path such as images/teacher-name.jpg.',classes:'Maintain class groups, classrooms, and their assigned teacher.',enrollments:'Connect a student to a class for an academic year.',attendance:'Record each student’s attendance by date and class.',payments:'Record school payments in the configured currency.',timetable:'Create lesson slots by class, teacher, day, and time.',announcements:'Publish school news, events, and notices for parents to read.',learning_updates:'Share class-specific subjects and topics with parents.',achievements:'Publish verified school achievements on the public website.'};
  return `${heading('NORTHSTAR ACADEMY / SCHOOL RECORDS',title,descriptions[module])}<section class="card panel module-form-panel"><div class="panelhead"><div><h2>${editing?'Edit':'Add'} record</h2><p>Saved to MySQL</p></div></div><form class="module-form" data-module-form="${module}"><input type="hidden" name="id" value="${editing?.id??''}"><div class="module-fields">${fieldHtml}</div><div class="actions"><button class="btn primary" type="submit">${editing?'Save changes':'Add record'}</button>${editing?'<button class="btn" type="button" data-module-cancel="'+module+'">Cancel</button>':''}</div></form></section><section class="card panel"><div class="panelhead"><div><h2>${title} records</h2><p>${data.records.length} record${data.records.length===1?'':'s'} · latest 500</p></div></div><div class="tablewrap"><table><thead><tr>${headers}<th>Actions</th></tr></thead><tbody>${rows||`<tr><td colspan="${Object.keys(data.fields).length+1}">No ${title.toLowerCase()} records yet. Use the form above to add one.</td></tr>`}</tbody></table></div></section>`;
}
async function loadModule(module){try{const response=await fetch(`school-api.php?module=${encodeURIComponent(module)}`,{headers:{Accept:'application/json'}});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message||'Could not load records.');moduleData[module]=data;csrfToken=data.csrf;render();}catch(error){toast(error.message||'Could not load school records.');}}
async function saveModule(module,action,id,values){const response=await fetch('school-api.php',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({module,action,id,values,csrf:csrfToken})});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.message||'Could not save record.');moduleEditing[module]=null;toast(result.message);await loadModule(module);await loadDashboardData();}
async function loadSchoolSettings(){try{const response=await fetch('school-api.php?module=settings',{headers:{Accept:'application/json'}});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.message);csrfToken=result.csrf;settings={schoolName:result.settings.school_name,adminName:result.settings.admin_name,year:result.settings.academic_year,term:result.settings.term,currency:result.settings.currency,contactEmail:result.settings.contact_email};render();}catch(error){toast(error.message||'Could not load school settings.');}}
function classesPage(){return managedPage('classes');}
function enrollmentsPage(){return managedPage('enrollments');}
function financePage(){return managedPage('payments');}
function timetablePage(){return managedPage('timetable');}
function announcementsPage(){return managedPage('announcements');}
function learningUpdatesPage(){return managedPage('learning_updates');}
function achievementsPage(){return managedPage('achievements');}
function reportsPage(){return `${heading('NORTHSTAR ACADEMY / INSIGHTS','Reports','Download student, attendance, and finance records from MySQL.')}<section class="report-grid"><article class="card report-card"><div class="stat-ico">♙</div><h3>Student directory</h3><p class="muted">Download registered student names, IDs, class, email, and status.</p><button class="btn" data-report="students">↓ &nbsp;Export students</button></article><article class="card report-card"><div class="stat-ico">◷</div><h3>Attendance register</h3><p class="muted">Download attendance entries saved in MySQL.</p><button class="btn" data-report="attendance">↓ &nbsp;Export attendance</button></article><article class="card report-card"><div class="stat-ico">＄</div><h3>Fee status</h3><p class="muted">Download the payment records currently saved in MySQL.</p><button class="btn" data-report="finance">↓ &nbsp;Export finance</button></article></section>`;}
function settingsPage(){return `${heading('NORTHSTAR ACADEMY / ADMIN','Settings','Manage official school details and defaults used in finance and enrollment.')}<section class="settings-grid"><article class="card panel"><h2>School profile</h2><form id="settingsForm"><div class="field"><label for="schoolName">School name</label><input id="schoolName" name="school_name" value="${escapeHtml(settings.schoolName)}" maxlength="80" required></div><div class="field"><label for="adminName">Administrator name</label><input id="adminName" name="admin_name" value="${escapeHtml(settings.adminName)}" maxlength="80" required></div><div class="field"><label for="year">Academic year</label><input id="year" name="academic_year" value="${escapeHtml(settings.year)}" maxlength="30" required></div><div class="field"><label for="term">Current term</label><select id="term" name="term">${['Autumn term','Spring term','Summer term'].map(t=>`<option ${settings.term===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="currency">Default currency</label><select id="currency" name="currency">${['USD','NGN','GBP','EUR'].map(c=>`<option ${settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label for="contactEmail">School contact email</label><input id="contactEmail" name="contact_email" type="email" value="${escapeHtml(settings.contactEmail||'')}"></div><div style="margin-top:18px"><button class="btn primary" type="submit">Save school settings</button></div></form></article><article class="card panel"><h2>About this dashboard</h2><p class="setting-note">Student, teacher, class, enrollment, attendance, finance, and timetable records are stored in MySQL. These settings are also saved in MySQL and used as the default for new school records.</p><p class="setting-note" style="margin-top:12px">Student registration is managed in the PHP register page. <a href="students.php" style="color:var(--green);font-weight:700">Open student register ↗</a></p></article></section>`;}
function helpPage(){return `${heading('NORTHSTAR ACADEMY / SUPPORT','Help guide','A quick guide to the main school dashboard tools.')}<section class="card panel"><h2>How to use the dashboard</h2><div class="schedule"><div class="event"><span class="time">01</span><i class="eventbar"></i><div><b>Register a student</b><small>Open Students, then choose Register a student to add a MySQL record.</small></div></div><div class="event"><span class="time">02</span><i class="eventbar"></i><div><b>Take attendance</b><small>Choose a class, update student statuses, and the register saves to MySQL.</small></div></div><div class="event"><span class="time">03</span><i class="eventbar"></i><div><b>Update school details</b><small>Settings lets you change the school name, administrator, year, and term.</small></div></div><div class="event"><span class="time">04</span><i class="eventbar"></i><div><b>Download reports</b><small>Reports exports the student, attendance, and fee lists as CSV files.</small></div></div></div></section>`;}
function notificationsPage(){return `${heading('NORTHSTAR ACADEMY / INBOX','School records','Quick links to the live registers and records in MySQL.')}<section class="card panel"><div class="schedule"><div class="event"><span class="time">Records</span><i class="eventbar"></i><div><b>Attendance register</b><small>Review and update attendance records.</small><button class="link" data-go="Attendance">Open attendance →</button></div></div><div class="event"><span class="time">Records</span><i class="eventbar"></i><div><b>Finance records</b><small>Review payments recorded for students.</small><button class="link" data-go="Finance">Open finance →</button></div></div><div class="event"><span class="time">Records</span><i class="eventbar"></i><div><b>Student register</b><small>Review students saved in the school database.</small><a class="link" href="students.php">Open student register →</a></div></div></div></section>`;}
function render(){document.getElementById('crumb').textContent=activePage.toUpperCase();document.getElementById('profileName').textContent=settings.adminName;document.getElementById('brandName').firstChild.textContent=settings.schoolName.toLowerCase();page.innerHTML=({Overview:overview,Students:studentsPage,Teachers:teachersPage,Attendance:attendancePage,Classes:classesPage,Enrollments:enrollmentsPage,Finance:financePage,Timetable:timetablePage,Announcements:announcementsPage,Learning:learningUpdatesPage,Achievements:achievementsPage,Reports:reportsPage,Settings:settingsPage,Help:helpPage,Notifications:notificationsPage})[activePage]?.()||overview();document.querySelectorAll('#nav [data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page===activePage));bindPage();}
function go(name){activePage=name;currentSearch='';document.getElementById('globalSearch').value='';render();const module={Teachers:'teachers',Classes:'classes',Enrollments:'enrollments',Attendance:'attendance',Finance:'payments',Timetable:'timetable',Announcements:'announcements',Learning:'learning_updates',Achievements:'achievements'}[name];if(module)loadModule(module);if(name==='Students')loadDashboardData('');if(name==='Settings')loadSchoolSettings();document.getElementById('sidebar').classList.remove('open');window.scrollTo(0,0);}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600);}
function downloadCsv(filename,rows){const csv=rows.map(row=>row.map(value=>{let cell=String(value??'');if(/^[=+\-@\t\r]/.test(cell))cell="'"+cell;return '"'+cell.replace(/"/g,'""')+'"';}).join(',')).join('\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download=filename;link.click();URL.revokeObjectURL(link.href);}
function exportStudents(){downloadCsv('northstar-students.csv',[['Name','Student ID','Class','Email','Enrollment status'],...students.map(s=>[s.full_name,s.student_number||`#${s.id}`,s.class_name,s.email,s.enrollment_status||'Not tracked'])]);}
async function exportAttendance(){try{const response=await fetch('school-api.php?module=attendance');const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message);downloadCsv('northstar-attendance.csv',[['Student','Class','Date','Status','Notes'],...data.records.map(r=>[r.student_name,r.class_name,r.attendance_date,r.status,r.notes])]);}catch(error){toast(error.message||'Could not export attendance.');}}
async function exportFinance(){try{const response=await fetch('school-api.php?module=payments');const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message);downloadCsv('northstar-payments.csv',[['Student','Amount','Currency','Date','Method','Status','Reference'],...data.records.map(r=>[r.student_name,r.amount,r.currency,r.paid_on,r.method,r.status,r.reference])]);}catch(error){toast(error.message||'Could not export payments.');}}
function bindPage(){
  const teacherPhotoInput=document.getElementById('teacherPhotoFile');if(teacherPhotoInput)teacherPhotoInput.onchange=()=>{const file=teacherPhotoInput.files?.[0];if(!file)return;if(file.size>2*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Choose a JPEG, PNG, or WebP photo up to 2 MB.');teacherPhotoInput.value='';return;}const preview=document.querySelector('[data-teacher-photo-preview]');const filename=document.querySelector('[data-teacher-photo-filename]');if(teacherPhotoInput.dataset.previewUrl)URL.revokeObjectURL(teacherPhotoInput.dataset.previewUrl);teacherPhotoInput.dataset.previewUrl=URL.createObjectURL(file);preview.innerHTML='';const image=document.createElement('img');image.src=teacherPhotoInput.dataset.previewUrl;image.alt='Selected teacher photo preview';preview.appendChild(image);filename.textContent=file.name;};
  const removeTeacherPhoto=page.querySelector('[data-remove-teacher-photo]');if(removeTeacherPhoto)removeTeacherPhoto.onclick=()=>{const form=removeTeacherPhoto.closest('form');form.dataset.removeTeacherPhoto='true';const input=form.querySelector('#teacherPhotoFile');if(input)input.value='';const preview=form.querySelector('[data-teacher-photo-preview]');preview.innerHTML='<span>No photo</span>';form.querySelector('[data-teacher-photo-filename]').textContent='Photo will be removed when you save';removeTeacherPhoto.remove();};
  page.querySelectorAll('[data-go]').forEach(button=>button.addEventListener('click',()=>go(button.dataset.go)));
  const exportAttendanceButton=document.getElementById('exportAttendance');if(exportAttendanceButton)exportAttendanceButton.onclick=exportAttendance;
  const exportFinanceButton=document.getElementById('exportFinance');if(exportFinanceButton)exportFinanceButton.onclick=exportFinance;
  const printTimetable=document.getElementById('printTimetable');if(printTimetable)printTimetable.onclick=()=>window.print();
  page.querySelectorAll('[data-report]').forEach(button=>button.onclick=()=>{if(button.dataset.report==='students')exportStudents();else if(button.dataset.report==='attendance')exportAttendance();else exportFinance();});
  const settingsForm=document.getElementById('settingsForm');
  page.querySelectorAll('[data-module-form]').forEach(form=>form.onsubmit=async event=>{event.preventDefault();const module=form.dataset.moduleForm;const values=Object.fromEntries(new FormData(form).entries());const id=values.id;delete values.id;let uploadedPhoto='';const oldPhoto=module==='teachers'?(moduleEditing.teachers?.photo_path||''):'';try{if(module==='teachers'){const photo=values.teacher_photo;delete values.teacher_photo;if(photo&&photo instanceof File&&photo.size){const upload=new FormData();upload.append('csrf',csrfToken);upload.append('photo',photo);const response=await fetch('teacher-photo.php',{method:'POST',body:upload,headers:{Accept:'application/json'}});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.message||'Photo upload failed.');values.photo_path=result.photo_path;uploadedPhoto=result.photo_path;}else{values.photo_path=form.dataset.removeTeacherPhoto==='true'?'':oldPhoto;}}await saveModule(module,id?'update':'create',id,values);if(module==='teachers'&&oldPhoto&&(form.dataset.removeTeacherPhoto==='true'||uploadedPhoto)){const cleanup=new FormData();cleanup.append('csrf',csrfToken);cleanup.append('action','delete');cleanup.append('path',oldPhoto);fetch('teacher-photo.php',{method:'POST',body:cleanup,headers:{Accept:'application/json'}}).catch(()=>{});}}catch(error){toast(uploadedPhoto?'Photo uploaded, but teacher details did not save. Submit again to finish.':error.message);}});
  page.querySelectorAll('[data-record-edit]').forEach(button=>button.onclick=()=>{const module=button.dataset.recordEdit;moduleEditing[module]=moduleData[module].records.find(item=>String(item.id)===button.dataset.id);render();});
  page.querySelectorAll('[data-record-delete]').forEach(button=>button.onclick=async()=>{if(!confirm('Delete this record? Related records may prevent deletion.'))return;try{await saveModule(button.dataset.recordDelete,'delete',button.dataset.id,{});}catch(error){toast(error.message);}});
  page.querySelectorAll('[data-module-cancel]').forEach(button=>button.onclick=()=>{moduleEditing[button.dataset.moduleCancel]=null;render();});
  if(settingsForm)settingsForm.onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(settingsForm).entries());try{const response=await fetch('school-api.php',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({module:'settings',action:'save',values,csrf:csrfToken})});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.message);await loadSchoolSettings();toast('School settings saved to MySQL.');}catch(error){toast(error.message||'Could not save school settings.');}};
}
document.getElementById('nav').onclick=event=>{const button=event.target.closest('[data-page]');if(button)go(button.dataset.page);};
let searchTimer;
document.getElementById('globalSearch').oninput=event=>{const query=event.target.value.trim();if(activePage!=='Students'){activePage='Students';}currentSearch=query;clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadDashboardData(query),250);render();document.getElementById('globalSearch').value=query;};
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('notif').onclick=()=>go('Notifications');
document.getElementById('settingsBtn').onclick=()=>go('Settings');
document.getElementById('helpBtn').onclick=()=>go('Help');
render();
loadSchoolSettings();
let dataRequest=0;
async function loadDashboardData(query=''){const request=++dataRequest;try{const response=await fetch(`dashboard-data.php?q=${encodeURIComponent(query)}`,{headers:{Accept:'application/json'}});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.message||'Could not load school records.');if(request!==dataRequest)return;students=result.students;dashboardStats=result.stats;attendanceToday=result.attendance_today;todayClasses=result.today_classes||[];dashboardLoaded=true;dashboardError='';}catch(error){if(request!==dataRequest)return;dashboardError='Unable to load database records. Check that XAMPP MySQL is running and config/database.php is correct.';}render();}
loadDashboardData();
</script>
